<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    SMath Studio (Mono) Font Compatibility Configuration
    Maps legacy Microsoft fonts lacking Unicode math/chemistry symbols (from msttcorefonts)
    to rich fonts (DejaVu Sans / DejaVu Serif / Segoe UI) so that characters never render
    as empty .notdef boxes in Mono libgdiplus.
  -->

  <!-- Alias Arial -> DejaVu Sans (full chemical reaction arrows, subscripts, and math symbols) -->
  <match target="pattern">
    <test name="family">
      <string>Arial</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <!-- Alias Helvetica -> DejaVu Sans -->
  <match target="pattern">
    <test name="family">
      <string>Helvetica</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <!-- Alias Times New Roman -> DejaVu Serif -->
  <match target="pattern">
    <test name="family">
      <string>Times New Roman</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>DejaVu Serif</string>
    </edit>
  </match>

  <!-- Alias Courier New -> DejaVu Sans Mono -->
  <match target="pattern">
    <test name="family">
      <string>Courier New</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

  <!-- Alias MS Sans Serif -> Segoe UI -->
  <match target="pattern">
    <test name="family">
      <string>MS Sans Serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Segoe UI</string>
    </edit>
  </match>
</fontconfig>
